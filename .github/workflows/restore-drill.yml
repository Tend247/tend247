# Monthly restore drill: build the sample workspace, export it, and prove the export restores
# row for row into a fresh workspace (npm run restore:check). Also runs on demand.
name: Restore drill

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_superuser_pw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_superuser_pw
      TEND247_DB_OWNER_URL: postgres://tend247_owner:ci_owner_pw@localhost:5432/tend247_drill
      TEND247_DB_APP_ROLE: tend247_app
      TEND247_DB_APP_PASSWORD: ci_app_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create the database
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role tend247_owner login password 'ci_owner_pw' createrole;
          create database tend247_drill owner tend247_owner;
          SQL
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run workspace:export -- --workspace fernhollow --out drill.tend247.ndjson.gz
      - run: npm run restore:check -- --bundle drill.tend247.ndjson.gz
      - name: Restore into a new workspace and keep it
        run: npm run restore:check -- --bundle drill.tend247.ndjson.gz --keep
