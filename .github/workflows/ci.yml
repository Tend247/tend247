# Tend 24/7 CI: typecheck, license policy, tests against real Postgres, build. A second job runs
# the same tests against PlanetScale Postgres when the repository has its secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_superuser_pw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_superuser_pw
      TEND247_TEST_DB_OWNER_URL: postgres://tend247_owner:ci_owner_pw@localhost:5432/tend247_test
      TEND247_TEST_DB_APP_URL: postgres://tend247_app:ci_app_pw@localhost:5432/tend247_test
      TEND247_TEST_DB_SUPERUSER_URL: postgres://postgres:ci_superuser_pw@localhost:5432/tend247_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role tend247_owner login password 'ci_owner_pw' createrole;
          create role tend247_app login password 'ci_app_pw' nobypassrls;
          create database tend247_test owner tend247_owner;
          SQL
      - run: npm ci
      - run: npm run typecheck
      - run: npm run licenses:check
      - run: npm test
      - run: npm run build
      - name: Build the tend247.com configuration
        run: npm run site:build
      - name: Installer dry run
        run: npm run setup -- --dry-run --yes --db-owner-url "$TEND247_TEST_DB_OWNER_URL" --admin-email ci@example.com --sign-in email --email-api-key x --email-from "CI <ci@example.com>"

  # The same suite against a hosted Postgres. Configure these repository secrets to turn it on:
  #   PLANETSCALE_OWNER_URL  the schema owner role (see docs/install.md, "PlanetScale")
  #   PLANETSCALE_APP_URL    the app role; created on first run with PLANETSCALE_APP_PASSWORD
  #   PLANETSCALE_APP_PASSWORD
  #   PLANETSCALE_ADMIN_URL  optional: the default postgres role, to prove the app refuses a
  #                          role with BYPASSRLS
  # Use a database reserved for CI: the tests drop and recreate its public schema.
  planetscale:
    runs-on: ubuntu-latest
    needs: verify
    concurrency: planetscale-ci
    env:
      TEND247_TEST_DB_OWNER_URL: ${{ secrets.PLANETSCALE_OWNER_URL }}
      TEND247_TEST_DB_APP_URL: ${{ secrets.PLANETSCALE_APP_URL }}
      TEND247_DB_APP_PASSWORD: ${{ secrets.PLANETSCALE_APP_PASSWORD }}
      TEND247_TEST_DB_SUPERUSER_URL: ${{ secrets.PLANETSCALE_ADMIN_URL }}
    steps:
      - name: Check for PlanetScale secrets
        id: gate
        run: |
          if [ -n "$TEND247_TEST_DB_OWNER_URL" ] && [ -n "$TEND247_TEST_DB_APP_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "PlanetScale secrets are not configured; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: Tests against PlanetScale Postgres
        if: steps.gate.outputs.run == 'true'
        run: npm test
